<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Login — Influz Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E1822;color:#F4F7F6;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#13202E;border:1px solid rgba(45,212,191,0.15);border-radius:12px;padding:48px;width:400px}
.logo{font-size:22px;font-weight:700;color:#2DD4BF;margin-bottom:4px}
.sub{font-size:13px;color:#7E8FA0;margin-bottom:32px}
label{display:block;font-size:12px;color:#7E8FA0;margin-bottom:6px}
input{width:100%;background:#1A2B3C;border:1px solid rgba(45,212,191,0.15);border-radius:6px;padding:12px;color:#F4F7F6;font-size:14px;margin-bottom:16px}
input:focus{outline:none;border-color:#2DD4BF}
.btn{width:100%;background:#2DD4BF;color:#0E1822;border:none;padding:12px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
.err{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:6px;padding:10px;font-size:13px;color:#F87171;margin-bottom:16px}
</style></head><body>
<div class="box">
  <div class="logo">Influz Studio</div>
  <div class="sub">Marketing Operating System</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="POST" action="/login">
    <label>Email</label>
    <input type="email" name="email" required placeholder="admin@influzstudio.com">
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn">Sign in →</button>
  </form>
</div>
</body></html>
